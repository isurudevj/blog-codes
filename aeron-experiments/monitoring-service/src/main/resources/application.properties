server.address=${METRICS_HOST:127.0.0.1}
server.port=${METRICS_PORT:9100}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.service=monitoring-service
spring.application.name=monitoring-service
logging.file.name=${LOG_FILE:/opt/apps/logs/monitoring-service.log}
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=1GB
