plugins {
    id 'application'
}

dependencies {
    implementation project(':common-lib')
    implementation "io.aeron:aeron-driver:${aeronVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    runtimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"
}

application {
    mainClass = 'io.github.aeron_experiments.mediadriver.MediaDriverApplication'
    applicationDefaultJvmArgs = [
        '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    ]
}

tasks.named('jar') {
    dependsOn configurations.runtimeClasspath
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Add-Opens': 'java.base/jdk.internal.misc'
        )
    }

    // Package the driver and Agrona so the documented `java -jar` command works.
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
